[package]
name = "smarttools-nav-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SmartTools navigation core: marker-based 6-DoF pose for AI-guided power tools"
repository = "https://github.com/matiasmolinas/smarttools"
publish = false

[lib]
name = "nav_core"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
